[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-layer"
version = "0.1.0"
description = "Unified context layer MVP for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "itsdangerous>=2.2,<3.0",
  "uvicorn>=0.32,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.setuptools]
packages = ["agent_context_layer"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
