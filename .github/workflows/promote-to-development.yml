---
# Promotes each successful main build's integrations-hub image to the
# development environment (https://integrations.dev.all-hands.dev) by
# dispatching to OpenHands/saas-deploy, which runs the
# promote-to-development action and bumps the integrations-hub image tag
# in app/openhands/environments/development/version.yaml (ArggoCD then
# syncs). Runs after the Docker workflow succeeds on main; can also be run
# manually (from main) to re-promote a known-good image tag.
#
# Uses the saas-deploy-dispatcher-inthub GitHub App credentials stored in
# the repo's dev-deploy environment secrets (SAAS_DEPLOY_DISPATCHER_APP_ID
# / SAAS_DEPLOY_DISPATCHER_APP_PRIVATE_KEY). The App is installed on
# OpenHands/saas-deploy (the dispatch target), not this repo.

name: Promote to development

on:
    workflow_dispatch:
        inputs:
            image-tag:
                description: Image tag to promote (defaults to sha-<full SHA> for the selected ref)
                required: false
                type: string
    workflow_run:
        workflows: [Docker]
        types: [completed]
        branches: [main]

# Queue promotions so an earlier main commit deploys before a later one.
concurrency:
    group: promote-to-development-integrations-hub
    cancel-in-progress: false

jobs:
    promote:
        # Only promote when the Docker build actually succeeded, or when run manually.
        # The Docker workflow also runs on pull_request, and the workflow_run branches
        # filter matches the *head* branch - a fork PR from a branch named "main"
        # would slip through - so additionally require a push event.
        if: >-
            ${{ github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: dev-deploy
        permissions:
            contents: read
        steps:
            - name: Compute image tag
              id: tag
              # Matches docker/metadata-action type=sha,format=long (sha-<full SHA>)
              # emitted by the Docker workflow. The integrations-hub dev version.yaml
              # pins the long-sha form, and the long-sha image is always pushed.
              env:
                  DISPATCH_IMAGE_TAG: ${{ github.event.inputs['image-tag'] }}
                  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  if [ -n "$DISPATCH_IMAGE_TAG" ]; then
                    echo "tag=$DISPATCH_IMAGE_TAG" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Mint token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ secrets.SAAS_DEPLOY_DISPATCHER_APP_ID }}
                  private-key: ${{ secrets.SAAS_DEPLOY_DISPATCHER_APP_PRIVATE_KEY }}
                  owner: OpenHands
                  repositories: saas-deploy
                  permission-contents: write

            - name: Dispatch promotion to saas-deploy
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  IMAGE_TAG: ${{ steps.tag.outputs.tag }}
                  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  gh api /repos/OpenHands/saas-deploy/dispatches \
                    -f event_type=promote-to-development \
                    -F client_payload[release]=openhands \
                    -F client_payload[tag-path]=.openhands.integrations-hub.image.tag \
                    -F client_payload[image-tag]="$IMAGE_TAG" \
                    -F client_payload[source-repo]="$GITHUB_REPOSITORY" \
                    -F client_payload[source-sha]="$SOURCE_SHA"
                  echo "Dispatched promote-to-development for integrations-hub ${IMAGE_TAG} (${SOURCE_SHA})."

            - name: Annotate dispatch failure
              if: ${{ failure() }}
              env:
                  IMAGE_TAG: ${{ steps.tag.outputs.tag }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
                  SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
              run: |
                  image_tag="${IMAGE_TAG:-sha-${HEAD_SHA}}"
                  source="${SOURCE_RUN_URL:-manual workflow_dispatch run}"
                  echo "::error title=Promote to development failed::Failed to dispatch promotion of integrations-hub ${image_tag} (${HEAD_SHA}) to development. Source: ${source}"
