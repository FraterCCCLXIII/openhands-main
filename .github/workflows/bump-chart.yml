# Opens a PR in OpenHands/OpenHands-Cloud pointing the integrations-hub
# chart's image.tag at the release that was just tagged. release-please pushes
# the semver tag (with the App token, so this trigger fires); ghcr-build.yml
# builds and publishes the image under the bare-semver tag (metadata-action
# {{version}} strips the v) concurrently.
name: Bump chart image tag

on:
  push:
    tags:
      # Stable semver only — the chart forbids sha/pre-release tags.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # A reusable-workflow caller job can't run steps, so strip the v prefix
  # here: tag v0.5.0 -> image tag 0.5.0, matching what ghcr-build.yml publishes.
  prepare-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.strip.outputs.tag }}
    steps:
      - id: strip
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  bump-chart:
    needs: prepare-tag
    # secrets: inherit forwards the org secrets RELEASE_APP_ID /
    # RELEASE_APP_PRIVATE_KEY that the reusable workflow needs.
    secrets: inherit
    uses: OpenHands/OpenHands-Cloud/.github/workflows/bump-image-tag.yml@main
    with:
      component: integrations-hub
      chart_file: charts/openhands/charts/integrations-hub/values.yaml
      tag: ${{ needs.prepare-tag.outputs.tag }}
