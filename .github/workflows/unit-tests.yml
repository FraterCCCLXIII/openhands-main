name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests, coverage, and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Run full Vitest coverage report
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Summarize branch coverage gaps
        run: |
          echo "## Branch coverage gap summary" >> "$GITHUB_STEP_SUMMARY"
          npm run coverage:branches -- --format=markdown | tee coverage/branch-gaps.md
          cat coverage/branch-gaps.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: error
