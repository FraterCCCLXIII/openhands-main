---
name: PR Artifacts

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  cleanup-after-merge:
    concurrency:
      group: cleanup-pr-artifacts-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check if fork PR
        id: check-fork
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
            echo "::notice::Fork PR detected - skipping auto-cleanup on base branch"
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: steps.check-fork.outputs.is_fork == 'false'
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}

      - name: Remove .pr/ directory from base branch
        id: remove
        if: steps.check-fork.outputs.is_fork == 'false'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -d ".pr" ]; then
            git config user.name "allhands-bot"
            git config user.email "allhands-bot@users.noreply.github.com"
            git rm -rf .pr/
            git commit -m "chore: remove merged PR artifacts [automated]"
            git push origin "HEAD:${BASE_REF}" || {
              echo "::error::Failed to push cleanup commit. Check branch protection rules."
              exit 1
            }
            echo "removed=true" >> $GITHUB_OUTPUT
            echo "::notice::Removed .pr/ directory from base branch"
          else
            echo "removed=false" >> $GITHUB_OUTPUT
            echo "::notice::No .pr/ directory to remove"
          fi

      - name: Comment on merged PR
        if: steps.check-fork.outputs.is_fork == 'false' && steps.remove.outputs.removed == 'true'
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          script: |
            const marker = '<!-- pr-artifacts-notice -->';
            const baseRef = process.env.BASE_REF;
            const body = `${marker}
            ✅ **PR Artifacts Cleaned Up**

            The \`.pr/\` directory was automatically removed from \`${baseRef}\` after merge.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  check-pr-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Check for .pr/ directory
        id: check
        run: |
          if [ -d ".pr" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::.pr/ directory exists and will be automatically removed from the base branch after merge. For fork PRs, manual removal is required."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Post or update PR comment
        if: steps.check.outputs.exists == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-artifacts-notice -->';
            const body = `${marker}
            📁 **PR Artifacts Notice**

            This PR contains a \`.pr/\` directory with PR-specific assets. It will be **automatically removed from the base branch after merge**.

            > For fork PRs: Manual removal is required before or after merging.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
