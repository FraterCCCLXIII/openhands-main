name: Sync Blog from Notion

on:
  schedule:
    # Pull Notion blog updates into GitHub every 6 hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync blog posts from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_INTEGRATION_KEY: ${{ secrets.NOTION_INTEGRATION_KEY }}
          NOTION_BLOG_DATABASE_ID: ${{ vars.NOTION_BLOG_DATABASE_ID || secrets.NOTION_BLOG_DATABASE_ID || '2cbcf0dd-f241-4e40-8c6d-0918e45f316f' }}
        run: npm run sync:notion-blog

      - name: Open pull request for blog updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC || secrets.GITHUB_TOKEN }}
          branch: chore/sync-notion-blog
          delete-branch: true
          commit-message: 'chore: sync blog posts from notion'
          committer: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          title: 'chore: sync blog posts from Notion'
          body: |
            This automated PR syncs blog markdown and referenced blog assets from the Notion blog source database into the GitHub repository.

            The workflow compares SHA-256 hashes before writing files, so this PR is only opened when Notion differs from the repository.

            _This PR was created by an automated workflow generated by an AI agent (OpenHands) on behalf of the user._
          labels: |
            automation
            blog
