[project]
name = "integrations-hub-backend"
version = "0.1.0"
description = "FastAPI backend for OpenHands Integrations Hub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "openhands-agent-server>=1.0.0,<2",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=43,<47",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
